<header class="dashboard-header">

  <div class="logo" routerLink="/dashboard">
    HealthAxis
  </div>

  <div class="right-section">

    <div class="notification" (click)="toggleNotifications()">
      🔔
      <span class="badge" *ngIf="notifications.length > 0">
        {{ notifications.length }}
      </span>
    </div>

    <div class="notif-dropdown" *ngIf="showNotifications">
      <p *ngIf="notifications.length === 0">No notifications</p>

      <div *ngFor="let n of notifications">
        {{ n }}
      </div>
    </div>

    <div class="profile">

      <!-- AVATAR -->
      <div class="avatar"
           (click)="toggleMenu()"
           [class.disabled]="!showMenuEnabled">
        {{ initials }}
      </div>

      <!-- ✅ DROPDOWN -->
      <div *ngIf="showMenu && showMenuEnabled" class="dropdown">

        <p class="name">{{ userName }}</p>

        <button (click)="goToProfile()">👤 View Profile</button>

        <button (click)="openPasswordModal()">🔒 Change Password</button>

        <button class="danger" (click)="logout()">🚪 Log Out</button>

      </div>

    </div>
  </div>
</header>
<!-- PASSWORD MODAL -->
<div class="modal" *ngIf="showPasswordModal">
  <div class="modal-box">
    <h3>Change Password</h3>

    <input type="password" placeholder="New Password">
    <input type="password" placeholder="Confirm Password">

    <div class="btn-group">
      <button (click)="closeModals()">Cancel</button>
      <button class="primary">Save</button>
    </div>
  </div>
</div>

<!-- LOGOUT MODAL -->
<div class="modal" *ngIf="showLogoutModal">
  <div class="modal-box">
    <h3>Are you sure you want to sign out?</h3>

    <div class="btn-group">
      <button (click)="closeModals()">Cancel</button>
      <button class="danger">Sign Out</button>
    </div>
  </div>
</div>
