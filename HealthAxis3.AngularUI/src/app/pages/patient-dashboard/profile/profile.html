<app-header [showMenuEnabled]="false"></app-header>

<!-- PROFILE CARD -->
<div class="profile-card">

  <h2>👤 My Profile</h2>

  <div class="form-group">
    <label>Full Name</label>
    <input [(ngModel)]="user.name" placeholder="Enter your name" />
  </div>

  <div class="form-group">
    <label>Email</label>
    <input [(ngModel)]="user.email" type="email" placeholder="Enter your email" required email />
  </div>

  <div class="form-group">
    <label>Date of Birth</label>
    <input type="date" [(ngModel)]="user.dob" />
  </div>

  <div class="info-box">
    Age: <strong>{{ age }}</strong>
  </div>

  <div class="form-group">
    <label>Phone Number</label>
    <input [(ngModel)]="user.phone" placeholder="Enter phone number" />
  </div>

  <div class="form-group">
    <label>Insurance ID</label>
    <input [(ngModel)]="user.insuranceId" placeholder="Enter insurance ID" />
  </div>

  <div class="form-group">
    <label>Gender</label>
    <select [(ngModel)]="user.gender">
      <option value="">Select Gender</option>
      <option>Male</option>
      <option>Female</option>
      <option>Other</option>
    </select>
  </div>
  <div *ngIf="saved" class="success-msg">
    Profile updated successfully ✅
  </div>
  <!-- ACTION BUTTON -->
  <button class="save-btn" (click)="saveProfile()">
    💾 Save Changes
  </button>

</div>

<div class="bottom-bar">
  <button class="back-btn" routerLink="/dashboard">
    ⬅ Back to Dashboard
  </button>
</div>
