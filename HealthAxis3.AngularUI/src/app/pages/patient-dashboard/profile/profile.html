<app-header [showMenuEnabled]="false"></app-header>

<!-- PROFILE CARD -->
<form #profileForm="ngForm" class="profile-card">

  <h2>👤 My Profile</h2>


  <div class="form-group">
    <label>Name *</label>
    <input name="name"
           [(ngModel)]="user.name"
           required
           #name="ngModel" />

    <div class="error" *ngIf="name.invalid && name.touched">
      Name is required
    </div>

    <div class="form-group">
      <label>Email *</label>
      <input name="email"
             [(ngModel)]="user.email"
             required
             email
             #email="ngModel" />

      <div class="error" *ngIf="email.invalid && email.touched">
        Enter a valid email
      </div>
    </div>

    <div class="form-group">
      <label>Date of Birth *</label>
      <input type="date"
             name="dob"
             [(ngModel)]="user.dob"
             required
             #dob="ngModel" />

      <div class="error" *ngIf="dob.invalid && dob.touched">
        Date of birth is required
      </div>
    </div>

    <div class="info-box">
      Age: <strong>{{ age }}</strong>
    </div>

    <div class="form-group">
      <label>Phone *</label>
      <input name="phone"
             [(ngModel)]="user.phone"
             required
             pattern="^[6-9][0-9]{9}$"
             #phone="ngModel" />

      <div class="error" *ngIf="phone.invalid && phone.touched">
        Enter valid 10-digit phone number
      </div>
    </div>

    <div class="form-group">
      <label>Insurance ID *</label>
      <input name="insuranceId"
             [(ngModel)]="user.insuranceId"
             required
             #insurance="ngModel" />

      <div class="error" *ngIf="insurance.invalid && insurance.touched">
        Insurance ID is required
      </div>
    </div>

    <div class="form-group">
      <label>Gender</label>
      <select name="gender" [(ngModel)]="user.gender" required #gender="ngModel">
        <option value="">Select Gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Transgender</option>
        <option>Others</option>
      </select>
      <div class="error" *ngIf="gender.invalid && gender.touched">
        Please select gender
      </div>
    </div>

  </div>
    <div *ngIf="saved" class="success-msg">
      Profile updated successfully ✅
    </div>
    <!-- ACTION BUTTON -->
    <button class="save-btn" [disabled]="profileForm.invalid" (click)="saveProfile()">
      💾 Save Changes
    </button>

  </form>

  <div class="bottom-bar">
    <button class="back-btn" routerLink="/dashboard">
      ⬅ Back to Dashboard
    </button>
  </div>
