<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f5f9ff"/>

  <!-- Head -->
  <circle cx="200" cy="120" r="40" fill="#ffd7b5"/>

  <!-- Body -->
  <rect x="150" y="160" width="100" height="140" rx="20" fill="#ffffff" stroke="#2a7de1" stroke-width="2"/>

  <!-- Stethoscope -->
  <path d="M180 180 Q200 230 220 180" stroke="#2a7de1" stroke-width="3" fill="none"/>
  <circle cx="200" cy="240" r="8" fill="#2a7de1"/>

  <!-- Coat details -->
  <line x1="200" y1="160" x2="200" y2="300" stroke="#ccc" stroke-width="2"/>

  <!-- Clipboard -->
  <rect x="240" y="200" width="60" height="80" rx="8" fill="#2a7de1"/>
  
  <!-- Title -->
  <text x="200" y="350" text-anchor="middle" font-size="18" fill="#2a7de1">
    HealthAxis
  </text>
</svg>
